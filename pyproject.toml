[project]
name = "spacebrains"
version = "0.1.0"
description = "Autonomous SpaceTraders.io player driven by LLMs (long horizon) and TypeSafe Jev (short horizon)"
authors = [{ name = "gradiuscypher", email = "gradiuscypher@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "typesafe-sdk>=0.6",
    "python-dotenv>=1.0",
]

[project.scripts]
spacebrains = "spacebrains.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF", "ANN"]
ignore = ["ANN401", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.pycodestyle]
max-line-length = 120
